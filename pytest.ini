[pytest]
testpaths = tests
markers =
    e2e: сквозные проверки со стабами провайдеров и тестовой БД
    fast: быстрый прогон без БД и внешних сервисов (цель < 20 с); проставляется
        автоматически в tests/conftest.py, руками не наносить
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning