# ruff — этап 5 рефакторинга: минимальный набор правил вместо py_compile.
# Заменяет шаг «Синтаксис» в чек-листе «Перед коммитом» (AGENTS.md).
target-version = "py39"
line-length = 120
exclude = ["venv", "data", "__pycache__"]

[lint]
# Дефолтный recommended-набор ruff — синтаксис/ошибки импорта/необъявленные имена.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Значения через star-импорт: ruff не разрешает имена из `from x import *`
    # (широкие багажи `._common`/`services.__init__` дают ~1100 ложных F405).
    "F405",
    # Отложенные импорты намеренные: refresh.py (порядок/циклы), sys.path-хаки
    # скриптов, импорты после кода в тестовых хелперах.
    "E402",
    # `df["col"] == True/False` в pandas — elementwise-идиома, не bool-сравнение.
    "E712",
]

[lint.per-file-ignores]
# Багажный модуль для `from ._common import *` (F401 = осознанные реэкспорты);
# параметр/локальная `settings` затеняют модульный импорт намеренно (F811).
"app/api/_common.py" = ["F401", "F811"]
